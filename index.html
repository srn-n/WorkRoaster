<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Hours Tracker</title>
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --text:#18212b; --muted:#687582;
  --line:#dfe5eb; --primary:#3b5ccc; --primary2:#304ba8;
  --soft:#edf0ff; --danger:#b34d3c; --shadow:0 14px 38px rgba(28,43,64,.08);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#f4f7fb,#e9eef5);color:var(--text);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}
#app{max-width:1050px;margin:auto;padding:28px 18px 70px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
h1{margin:0;font-size:32px;letter-spacing:-.04em}
.subtitle{color:var(--muted);margin:7px 0 0;font-size:14px}
.badge{background:var(--soft);color:var(--primary);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700}
.panel,.week{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel{padding:20px;margin-bottom:22px}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-title h2{font-size:16px;margin:0}.hint{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{width:100%;height:43px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#f8fafc;color:var(--text);outline:none}
.duration-input{display:flex;align-items:center;gap:7px}
.duration-input input{flex:1;min-width:0}
.duration-unit{font-size:12px;color:var(--muted);font-weight:700}
.duration-help{display:block;margin-top:5px;font-size:11px;color:var(--muted)}
.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(23,107,91,.10);background:#fff}
.actions{display:flex;gap:9px;margin-top:16px}
.btn{border:0;border-radius:11px;height:42px;padding:0 17px;font-weight:700;cursor:pointer}
.primary{background:var(--primary);color:white}.primary:hover{background:var(--primary2)}
.secondary{background:#f2f5f3;color:var(--text);border:1px solid var(--line)}
.error{color:var(--danger);font-size:12px;margin-top:9px;min-height:16px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat-value{font-size:25px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.week{margin-bottom:16px;overflow:hidden}
.week-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;background:#fbfcfc;border-bottom:1px solid var(--line)}
.week-range{font-weight:800;font-size:14px}.week-total{font-size:13px;color:var(--primary);font-weight:800}
.row{padding:14px 18px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.row-main{display:grid;grid-template-columns:120px 105px 1fr 85px auto;align-items:center;gap:14px}
.day{font-weight:700}.date{font-size:12px;color:var(--muted);margin-top:2px}
.start{font-variant-numeric:tabular-nums;font-weight:700}.notes{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hours{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:4px}.icon{border:0;background:transparent;color:var(--muted);padding:7px 9px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}
.icon:hover{background:var(--soft);color:var(--primary)}.delete:hover{background:#f9e9e5;color:var(--danger)}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;font-size:11px;color:var(--muted)}
.tag{background:var(--soft);color:var(--primary);padding:4px 8px;border-radius:999px;font-weight:700}
.empty{text-align:center;padding:55px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:rgba(255,255,255,.6)}
.cycle{margin-bottom:18px}.cycle-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;background:#f7f9fc;border:1px solid var(--line);border-radius:15px;margin-bottom:9px}
.cycle-name{font-weight:800;font-size:15px}.cycle-info{font-size:12px;color:var(--muted);font-weight:700}
.cycle-total{color:var(--primary);font-weight:800;font-variant-numeric:tabular-nums}
.editing{background:var(--soft);color:var(--primary);padding:9px 12px;border-radius:10px;margin-bottom:12px;font-size:12px;font-weight:800}
@media(max-width:760px){
 .grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}
 .row-main{grid-template-columns:1fr 1fr auto}.notes{grid-column:1/3}.hours{grid-column:2;text-align:right}
 .row-actions{grid-column:3;grid-row:1}.row-actions .icon{padding:5px}
}
@media(max-width:480px){#app{padding:20px 12px 50px}header{align-items:flex-start}.badge{display:none}
 .grid,.summary{grid-template-columns:1fr}.row-main{grid-template-columns:1fr auto}.notes{grid-column:1/2}.hours{grid-column:2;grid-row:2}
 .row-actions{grid-column:2;grid-row:1}.week-head{padding:13px}.row{padding:13px}}
.rate-input{font-weight:700;background:#f1f4f8!important;color:var(--primary)!important}
.record-rate{color:var(--primary);font-weight:700}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.insight-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.insight-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.insight-value{font-size:25px;font-weight:800;margin-top:7px}
.insight-note{font-size:12px;color:var(--muted);margin-top:5px}
@media(max-width:480px){.insights{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const KEY='modern_work_hours_tracker_v1';
  let records=JSON.parse(localStorage.getItem(KEY)||'[]');
  let editing=null;

  const dayTypes=['Day','Afternoon','Night','Overnight'];
  const payTypes=['Normal','Overtime','Weekend','Public Holiday','Casual loading'];

  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>'$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const hours=n=>(Math.round((Number(n)||0)*100)/100).toString().replace(/\.00$/,'')+'h';

  const durationMinutes=(h,m)=>{
    const hoursValue=Math.max(0,Number(h)||0);
    const minutesValue=Math.max(0,Math.min(59,Number(m)||0));
    return Math.round(hoursValue*60+minutesValue);
  };
  const recordMinutes=r=>{
    if(Number.isFinite(Number(r.workingMinutes))) return Number(r.workingMinutes);
    return Math.round((Number(r.workingHours)||0)*60);
  };
  const decimalHoursFromMinutes=m=>Math.round((Number(m)||0)/60*100)/100;
  const hourlyRate=(pay,minutes)=>{
    const h=decimalHoursFromMinutes(minutes);
    return h>0 ? Number(pay||0)/h : 0;
  };
  const dateValue=d=>new Date((d||'')+'T00:00:00').getTime()||0;
  const cycleSortDate=c=>Math.min(...records.filter(r=>(r.cycle||'Unassigned')===c).map(r=>dateValue(r.date)));
  const cycleHours=c=>records.filter(r=>(r.cycle||'Unassigned')===c).reduce((a,x)=>a+recordMinutes(x),0);
  const averageStartTime=()=>{
    const valid=records.filter(r=>/^\d{2}:\d{2}$/.test(r.start||''));
    if(!valid.length) return '—';
    const total=valid.reduce((sum,r)=>{
      const [h,m]=r.start.split(':').map(Number);
      return sum+h*60+m;
    },0);
    const mins=Math.round(total/valid.length);
    const h=Math.floor(mins/60)%24, m=mins%60;
    return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  };
  const moneyPerHour=(pay,minutes)=>{
    const rate=hourlyRate(pay,minutes);
    return rate>0 ? '$'+rate.toFixed(2)+'/hr' : '—';
  };
  const durationLabel=m=>hours(decimalHoursFromMinutes(m));
  const today=()=>new Date().toISOString().slice(0,10);
  const dayName=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});
  const dateName=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
  const save=()=>localStorage.setItem(KEY,JSON.stringify(records));

  function updateCalculatedRate(){
    const pay=Number(document.getElementById('pay')?.value||0);
    const h=document.getElementById('workingHours')?.value||0;
    const m=document.getElementById('workingMinutes')?.value||0;
    const mins=durationMinutes(h,m);
    const el=document.getElementById('calculatedRate');
    if(el) el.value=pay>0&&mins>0?moneyPerHour(pay,mins):'—';
  }

  function render(){
    const e=editing?records.find(x=>x.id===editing):null;
    const totalMinutes=records.reduce((a,x)=>a+recordMinutes(x),0);
    const totalPay=records.reduce((a,x)=>a+(Number(x.paymentAmount)||0),0);
    const overallRate=hourlyRate(totalPay,totalMinutes);
    const cycles={};
    [...records].sort((a,b)=>dateValue(b.date)-dateValue(a.date)||String(b.start||'').localeCompare(String(a.start||''))).forEach(x=>{
      const key=x.cycle||'Unassigned';
      (cycles[key]??=[]).push(x);
    });
    const cycleOrder=Object.keys(cycles).sort((a,b)=>{
      const startA=cycleSortDate(a);
      const startB=cycleSortDate(b);
      return startB-startA;
    });

    document.getElementById('app').innerHTML=`
      <header>
        <div><h1>Work Hours</h1><p class="subtitle">Track starting times, working hours, pay and fortnight payment cycles.</p></div>
        <span class="badge">Saved automatically</span>
      </header>
      <section class="panel">
        <div class="panel-title"><h2>${e?'Edit record':'Add work record'}</h2><span class="hint">Assign each record to the fortnight/payment cycle it belongs to.</span></div>
        ${e?`<div class="editing">Editing ${esc(dateName(e.date))}</div>`:''}
        <div class="grid">
          <div class="field"><label>Date</label><input id="date" type="date" value="${e?e.date:today()}"></div>
          <div class="field"><label>Starting time</label><input id="start" type="time" value="${e?e.start:'09:00'}"></div>
          <div class="field"><label>Working hours</label><div class="duration-input"><input id="workingHours" type="number" min="0" step="1" placeholder="2" value="${e?Math.floor(recordMinutes(e)/60):''}"><span class="duration-unit">hr</span><input id="workingMinutes" type="number" min="0" max="59" step="1" placeholder="22" value="${e?(recordMinutes(e)%60):''}"><span class="duration-unit">m</span></div><small class="duration-help">Example: 2 hr 22 m</small></div>
          <div class="field"><label>Fortnight / pay cycle</label><input id="cycle" placeholder="e.g. Fortnight 1" value="${e?esc(e.cycle||''):''}"></div>
          <div class="field"><label>Map number</label><input id="map" placeholder="e.g. Grid B4" value="${e?esc(e.mapNumber):''}"></div>
          <div class="field"><label>Day type</label><select id="dayType">${dayTypes.map(x=>`<option ${e?.dayType===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Payment type</label><select id="payType">${payTypes.map(x=>`<option ${e?.paymentType===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Payment amount</label><input id="pay" type="number" min="0" step="0.01" placeholder="0.00" value="${e?e.paymentAmount:''}"></div>
          <div class="field"><label>Earned per hour</label><input id="calculatedRate" class="rate-input" type="text" value="—" readonly><small class="duration-help">Automatically calculated from this day's pay and working time.</small></div>
          <div class="field"><label>Role / notes</label><input id="notes" placeholder="e.g. Floor, Store 12" value="${e?esc(e.notes):''}"></div>
        </div>
        <div class="error" id="error"></div>
        <div class="actions"><button class="btn primary" id="submit">${e?'Save changes':'Add record'}</button>${e?'<button class="btn secondary" id="cancel">Cancel</button>':''}</div>
      </section>
      <div class="summary">
        <div class="stat"><div class="stat-label">Latest fortnight hours</div><div class="stat-value">${durationLabel(cycleOrder.length ? cycleHours(cycleOrder[0]) : 0)}</div></div>
        <div class="stat"><div class="stat-label">Overall working hours</div><div class="stat-value">${durationLabel(totalMinutes)}</div></div>
        <div class="stat"><div class="stat-label">Latest fortnight pay</div><div class="stat-value">${money(cycleOrder.length ? cycles[cycleOrder[0]].reduce((a,x)=>a+(Number(x.paymentAmount)||0),0) : 0)}</div></div>
        <div class="stat"><div class="stat-label">Total pay</div><div class="stat-value">${money(totalPay)}</div></div>
        <div class="stat"><div class="stat-label">Records</div><div class="stat-value">${records.length}</div></div>
      </div>
      <div>
        ${!records.length?'<div class="empty">No work records yet.<br>Add your first record above.</div>':cycleOrder.map(c=>`
          <section class="cycle">
            <div class="cycle-head"><span><span class="cycle-name">${esc(c)}</span><span class="cycle-info"> · ${cycles[c].length} record${cycles[c].length===1?'':'s'}</span></span><span class="cycle-total">${durationLabel(cycles[c].reduce((a,x)=>a+recordMinutes(x),0))} · ${money(cycles[c].reduce((a,x)=>a+(Number(x.paymentAmount)||0),0))}</span></div>
            <div class="week">
            ${cycles[c].slice().sort((a,b)=>dateValue(b.date)-dateValue(a.date)||String(b.start||'').localeCompare(String(a.start||''))).map(x=>`
              <div class="row"><div class="row-main"><div><div class="day">${dayName(x.date)}</div><div class="date">${dateName(x.date)}</div></div><div class="start">Start ${esc(x.start)}</div><div class="notes">${esc(x.notes||'')}</div><div class="hours">${durationLabel(recordMinutes(x))} <span class="record-rate">· ${moneyPerHour(x.paymentAmount,recordMinutes(x))}</span></div><div class="row-actions"><button class="icon edit" data-id="${x.id}">Edit</button><button class="icon delete" data-id="${x.id}">Delete</button></div></div>
              <div class="meta"><span class="tag">${esc(x.dayType||'Day')}</span><span>Cycle: <b>${esc(x.cycle||'Unassigned')}</b></span><span>Working: <b>${durationLabel(recordMinutes(x))}</b></span>${x.mapNumber?`<span>Map: <b>${esc(x.mapNumber)}</b></span>`:''}<span>${esc(x.paymentType||'Normal')}: <b>${money(x.paymentAmount)}</b></span><span>Earned/hr: <b class="record-rate">${moneyPerHour(x.paymentAmount,recordMinutes(x))}</b></span></div></div>`).join('')}
            </div>
          </section>`).join('')}
      </div>
      <section class="insights">
        <div class="insight-card"><div class="insight-label">Usual starting time</div><div class="insight-value">${averageStartTime()}</div><div class="insight-note">Average start time across all recorded work days.</div></div>
        <div class="insight-card"><div class="insight-label">Average earning per hour</div><div class="insight-value">${overallRate>0?'$'+overallRate.toFixed(2)+'/hr':'—'}</div><div class="insight-note">Based on total earnings divided by total working time.</div></div>
      </section>`;

    document.getElementById('submit').onclick=submit;
    ['pay','workingHours','workingMinutes'].forEach(id=>document.getElementById(id)?.addEventListener('input',updateCalculatedRate));
    updateCalculatedRate();
    if(document.getElementById('cancel')) document.getElementById('cancel').onclick=()=>{editing=null;render()};
    document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{editing=b.dataset.id;render();window.scrollTo({top:0,behavior:'smooth'})});
    document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{if(confirm('Delete this work record?')){records=records.filter(x=>x.id!==b.dataset.id);save();render()}});
  }

  function submit(){
    const data={
      date:document.getElementById('date').value,
      start:document.getElementById('start').value,
      cycle:document.getElementById('cycle').value.trim() || 'Unassigned',
      workingMinutes:durationMinutes(document.getElementById('workingHours').value,document.getElementById('workingMinutes').value),
      mapNumber:document.getElementById('map').value.trim(),
      dayType:document.getElementById('dayType').value,
      paymentType:document.getElementById('payType').value,
      paymentAmount:Number(document.getElementById('pay').value)||0,
      notes:document.getElementById('notes').value.trim()
    };
    const err=document.getElementById('error');
    const hoursInput=document.getElementById('workingHours').value;
    const minutesInput=document.getElementById('workingMinutes').value;
    if(!data.date||!data.start||hoursInput===''||minutesInput===''||data.workingMinutes<0){err.textContent='Date, starting time, hours and minutes are required.';return}
    err.textContent='';
    if(editing){const r=records.find(x=>x.id===editing);Object.assign(r,data);editing=null}
    else records.push({id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36),...data});
    save();render();
  }
  render();
})();
</script>
</body>
</html>
