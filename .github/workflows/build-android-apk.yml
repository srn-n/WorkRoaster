name: Build WorkRoaster Android app

# Push to main  → a debug APK to install on your own phone for testing.
# Push a v* tag → a signed release: the .aab for Google Play plus a signed .apk.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests (includes the Android privacy-promise checks)
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Work out the version
        id: version
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)."
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$TAG"
            if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
              echo "::error::Minor and patch numbers must be 0-99."
              exit 1
            fi
            # v1.2.3 → 10203. Always grows with the version, as Play requires.
            echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
            echo "name=0.0.0-test.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        if: env.IS_RELEASE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}

      - name: Restore the upload key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKROASTER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The WORKROASTER_KEYSTORE_BASE64 secret is missing (see docs/android-release.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release (AAB for Play + APK)
        if: env.IS_RELEASE == 'true'
        working-directory: android
        env:
          WORKROASTER_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          WORKROASTER_KEYSTORE_PASSWORD: ${{ secrets.WORKROASTER_KEYSTORE_PASSWORD }}
          WORKROASTER_KEY_ALIAS: ${{ secrets.WORKROASTER_KEY_ALIAS }}
          WORKROASTER_KEY_PASSWORD: ${{ secrets.WORKROASTER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}

      - name: Remove the upload key from the runner
        if: always() && env.IS_RELEASE == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Check the finished app keeps its promises
        run: |
          if [ "$IS_RELEASE" = "true" ]; then APK=android/app/build/outputs/apk/release/app-release.apk; else APK=android/app/build/outputs/apk/debug/app-debug.apk; fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^package:|targetSdkVersion|^sdkVersion"
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests INTERNET. WorkRoaster must not have network access."
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
            if "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
              echo "::error::The release APK is debuggable."
              exit 1
            fi
          fi

      - name: Upload debug APK
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WorkRoaster-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release (AAB + APK)
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WorkRoaster-${{ steps.version.outputs.name }}-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
