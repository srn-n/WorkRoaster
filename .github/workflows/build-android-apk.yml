name: Build WorkRoaster Android app

# Push to main  → a debug APK to install on your own phone for testing.
# Push a v* tag → a signed release: the .aab for Google Play plus a signed .apk.
#   The tag must match "version" in package.json, e.g. for 0.0.1:
#   git tag v0.0.1 && git push origin v0.0.1
#
# Every action is pinned to a full commit SHA (the comment shows its version):
# release builds handle the signing key, so a moved or hijacked tag on a
# third-party action must not be able to change what runs here.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1

      - name: Install web dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests (includes the Android privacy-promise checks)
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Work out the version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version must look like 1.2.3 (got $VERSION)."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::Minor and patch numbers must be 0-99."
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}. Tag v${VERSION}, or update package.json first."
              exit 1
            fi
            # 0.0.1 → 1, 1.2.3 → 10203. Always grows with the version, as Play requires.
            echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
            echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
            echo "name=${VERSION}-debug.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        if: env.IS_RELEASE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}

      - name: Restore the upload key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKROASTER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The WORKROASTER_KEYSTORE_BASE64 secret is missing (see docs/android-release.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release (AAB for Play + APK)
        if: env.IS_RELEASE == 'true'
        working-directory: android
        env:
          WORKROASTER_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          WORKROASTER_KEYSTORE_PASSWORD: ${{ secrets.WORKROASTER_KEYSTORE_PASSWORD }}
          WORKROASTER_KEY_ALIAS: ${{ secrets.WORKROASTER_KEY_ALIAS }}
          WORKROASTER_KEY_PASSWORD: ${{ secrets.WORKROASTER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}

      - name: Remove the upload key from the runner
        if: always() && env.IS_RELEASE == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Check the finished app keeps its promises
        run: |
          if [ "$IS_RELEASE" = "true" ]; then APK=android/app/build/outputs/apk/release/app-release.apk; else APK=android/app/build/outputs/apk/debug/app-debug.apk; fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^package:|targetSdkVersion|^sdkVersion"
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests INTERNET. WorkRoaster must not have network access."
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
            if "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
              echo "::error::The release APK is debuggable."
              exit 1
            fi
          fi

      - name: Upload debug APK
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkRoaster-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release (AAB + APK)
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkRoaster-${{ steps.version.outputs.name }}-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
